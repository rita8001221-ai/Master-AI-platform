<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master AI Platform</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f5f6fa; padding: 10px; color: #333; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 15px; }
        .header-left { display: flex; align-items: center; }
        .menu-icon { font-size: 24px; cursor: pointer; margin-right: 10px; color: #2c3e50; font-weight: bold; }
        .header h2 { margin: 0; color: #1e3799; font-size: 18px; }
        
        .sidebar { height: 100%; width: 0; position: fixed; z-index: 1000; top: 0; left: 0; background-color: #2c3e50; overflow-x: hidden; transition: 0.3s; padding-top: 60px; box-shadow: 2px 0 5px rgba(0,0,0,0.2); }
        .sidebar a { padding: 12px 15px 12px 30px; text-decoration: none; font-size: 16px; color: #ecf0f1; display: block; transition: 0.2s; font-weight: bold; cursor: pointer; }
        .sidebar a:hover { color: #3498db; background-color: #34495e; }
        .sidebar .closebtn { position: absolute; top: 10px; right: 20px; font-size: 30px; color: #fff; background: none; border: none; cursor: pointer; }
        
        .section-title { font-size: 15px; font-weight: bold; margin: 15px 0 10px 0; color: #2c3e50; display: flex; justify-content: space-between; align-items: center; }
        .grid-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
        .card { background: #fff; border-top: 4px solid #e74c3c; padding: 12px 5px; text-align: center; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); font-size: 12px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .card:active { transform: scale(0.95); }
        .card.green-top { border-top-color: #2ecc71; }
        .card-icon { font-size: 24px; margin-bottom: 4px; }
        
        .social-box { background: #fff; padding: 15px; border-radius: 15px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); margin-bottom: 20px; text-align: center; }
        .search-bar { width: 100%; padding: 10px 15px; border: 1px solid #ddd; border-radius: 20px; margin-bottom: 15px; background: #f8f9fa; outline: none; font-size: 13px; }
        .social-buttons { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
        .social-buttons button { border: none; padding: 8px 14px; border-radius: 20px; color: white; font-size: 12px; font-weight: bold; cursor: pointer; }
        .btn-whatsapp { background: #2ecc71; } .btn-telegram { background: #0984e3; } .btn-youtube { background: #e74c3c; } .btn-facebook { background: #3b5998; } .btn-instagram { background: #e84393; }

        .stats-box { display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 12px 15px; border-radius: 15px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .follow-btn { background: #0984e3; color: white; border: none; padding: 8px 22px; border-radius: 20px; font-weight: bold; cursor: pointer; }

        .overlay-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); z-index: 9999; display: flex; justify-content: center; align-items: flex-start; padding: 20px; overflow-y: auto; backdrop-filter: blur(5px); }
        .manager-modal { background: #fff; padding: 20px; border-radius: 15px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); margin-top: 20px; text-align: center; }
        .btn-close { background: #95a5a6; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; }
        .btn-save { background: #34495e; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; }
    </style>
</head>
<body>

    <div id="mySidebar" class="sidebar">
        <button class="closebtn" onclick="closeNav()">×</button>
        <a onclick="goHome()">🏠 Home</a>
        <a onclick="openProfile()">👤 Profile</a>
        <a onclick="openShareOptions()">📤 Share Platform</a>
    </div>

    <!-- Share Modal -->
    <div id="share-modal-screen" class="overlay-screen" style="display: none; align-items: center;">
        <div class="manager-modal" style="padding: 25px 20px;">
            <h3 style="color: #2c3e50; margin-bottom: 20px;">Share Platform</h3>
            <button class="btn-save" style="margin-bottom: 12px;" onclick="copyLink()">📋 Copy Link</button>
            <button class="btn-close" onclick="closeShareOptions()">✖ Cancel</button>
        </div>
    </div>

    <!-- View Profile Modal -->
    <div id="profile-modal-screen" class="overlay-screen" style="display: none; align-items: center;">
        <div class="manager-modal" style="padding: 30px 20px;">
            <img id="public-prof-img" src="YOUR_PROFILE_IMAGE_LINK_HERE" alt="Profile Picture" style="width: 110px; height: 110px; border-radius: 50%; object-fit: cover; border: 4px solid #3498db; margin-bottom: 15px;">
            <h2 id="public-prof-name" style="color: #2c3e50; margin-bottom: 5px;">Master AI</h2>
            <p id="public-prof-desc" style="font-size: 14px; color: #7f8c8d; margin-bottom: 25px;">Official Digital Platform & Media Content Creator.</p>
            <button class="btn-close" onclick="closeProfile()">✖ Close Profile</button>
        </div>
    </div>

    <div class="header">
        <div class="header-left">
            <span class="menu-icon" onclick="openNav()">☰</span>
            <h2>Master AI Platform</h2>
        </div>
    </div>

    <div class="social-box">
        <input type="text" id="main-search" class="search-bar" placeholder="🔍 Search apps or platforms..." onkeyup="filterCards()">
        <div class="section-title" style="text-align: left; margin-top: 0; margin-bottom: 10px;">Social Results:</div>
        
        <!-- Social Buttons Fixed -->
        <div class="social-buttons">
            <button class="btn-whatsapp" onclick="window.open('YOUR_WHATSAPP_LINK_HERE', '_blank')">💬 WhatsApp</button>
            <button class="btn-telegram" onclick="window.open('YOUR_TELEGRAM_LINK_HERE', '_blank')">✈️ Telegram</button>
            <button class="btn-youtube" onclick="window.open('YOUR_YOUTUBE_LINK_HERE', '_blank')">▶️ YouTube</button>
            <button class="btn-facebook" onclick="window.open('YOUR_FACEBOOK_LINK_HERE', '_blank')">📘 Facebook</button>
            <button class="btn-instagram" onclick="window.open('YOUR_INSTAGRAM_LINK_HERE', '_blank')">📷 Instagram</button>
        </div>
    </div>

    <div class="stats-box">
        <div>👥 <strong id="follower-count-text">0 Followers</strong></div>
        <button class="follow-btn" id="follow-action-btn" onclick="followAction()">Follow</button>
    </div>

    <div class="section-title">🌐 Public Projects (Users)</div>
    <div class="grid-container" id="public-grid">
        <div class="card normal-card green-top" data-link="YOUR_LINK_HERE" onclick="handleCardClick(this)">
            <div class="card-icon">📝</div><span class="card-title-text">BLOG</span><br><small style="font-weight: normal; color: #7f8c8d;">Blogs</small>
        </div>
        <div class="card normal-card green-top" data-link="YOUR_LINK_HERE" onclick="handleCardClick(this)">
            <div class="card-icon">🎬</div><span class="card-title-text">VIDEO</span><br><small style="font-weight: normal; color: #7f8c8d;">Videos</small>
        </div>
        <div class="card normal-card green-top" data-link="YOUR_LINK_HERE" onclick="handleCardClick(this)">
            <div class="card-icon">🎮</div><span class="card-title-text">GAME</span><br><small style="font-weight: normal; color: #7f8c8d;">Gaming</small>
        </div>
        <div class="card normal-card green-top" data-link="YOUR_LINK_HERE" onclick="handleCardClick(this)">
            <div class="card-icon">💬</div><span class="card-title-text">CHAT</span><br><small style="font-weight: normal; color: #7f8c8d;">Public</small>
        </div>
    </div>

    <script>
        function openNav() { document.getElementById("mySidebar").style.width = "250px"; }
        function closeNav() { document.getElementById("mySidebar").style.width = "0"; }
        function goHome() { closeNav(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
        
        function openProfile() { closeNav(); document.getElementById('profile-modal-screen').style.display = 'flex'; }
        function closeProfile() { document.getElementById('profile-modal-screen').style.display = 'none'; }
        
        function openShareOptions() { closeNav(); document.getElementById('share-modal-screen').style.display = 'flex'; }
        function closeShareOptions() { document.getElementById('share-modal-screen').style.display = 'none'; }
        function copyLink() { navigator.clipboard.writeText(window.location.href).then(() => alert("✅ Link copied!")); }

        function handleCardClick(card) {
            let url = card.getAttribute('data-link');
            if (url && url !== 'YOUR_LINK_HERE' && url !== '#') {
                window.open(url, '_blank');
            } else {
                alert("দুঃখিত, এই লিংকটি বর্তমানে কাজ করছে না।");
            }
        }

        function filterCards() {
            let input = document.getElementById('main-search').value.toUpperCase();
            let cards = document.querySelectorAll('.normal-card');
            cards.forEach(c => {
                c.style.display = c.innerText.toUpperCase().indexOf(input) > -1 ? "" : "none";
            });
        }

        let isFollowing = false;
        let currentFollowers = 0;
        function followAction() {
            let btn = document.getElementById('follow-action-btn');
            let text = document.getElementById('follower-count-text');
            if(!isFollowing) {
                isFollowing = true; currentFollowers++;
                btn.innerText = "Following"; btn.style.background = "#2ecc71";
            } else {
                isFollowing = false; currentFollowers--;
                btn.innerText = "Follow"; btn.style.background = "#0984e3";
            }
            text.innerText = currentFollowers + " Followers";
        }
    </script>
</body>
</html>
